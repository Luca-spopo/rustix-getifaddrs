[package]
name = "rustix-getifaddrs"
version = "0.0.4"
edition = "2024"
authors = ["Anirudh 'Luca' Katoch <katoch.anirudh@gmail.com>"]
repository = "https://github.com/Luca-spopo/rustix-getifaddrs"
license = "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT"
keywords = ["rustix", "getifaddrs", "network", "interface", "syscall"]
categories = ["os::unix-apis", "network-programming", "api-bindings", "no-std"]
description = "Implementation of `getifaddrs` using syscalls in rustix"

[dependencies]
nix = { version = "0.31.2", features = ["net"]}
